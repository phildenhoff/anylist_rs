name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Jobs use the Rust that ships on the runner images (stable, with clippy and
# rustfmt) rather than downloading the newest release, which saves ~8 s per
# job. The images are updated weekly, so they can trail a new stable briefly.

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features

  test:
    name: test (${{ matrix.os }}, ${{ matrix.tls }})
    runs-on: ${{ matrix.os }}
    env:
      # Debug info isn't needed in CI; dropping it speeds up linking the test
      # binaries and shrinks the cache.
      CARGO_PROFILE_DEV_DEBUG: 0
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        tls: [native-tls, rustls-tls]
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.tls }}
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Test
        run: cargo nextest run --no-default-features --features ${{ matrix.tls }}
      # nextest doesn't run doctests.
      - name: Doctests
        run: cargo test --doc --no-default-features --features ${{ matrix.tls }}
